<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Méca — L'enquêteur des systèmes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:      #080c18;
      --panel:   #0d1428;
      --border:  #1a2a4a;
      --cyan:    #00e5ff;
      --green:   #00ff9d;
      --amber:   #ffbe00;
      --red:     #ff4757;
      --text:    #c8d8f0;
      --muted:   #5a7090;
      --bubble-meca: #0d1e3a;
      --bubble-user: #0a2a1a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── grid texture ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── scanline overlay ── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,.06) 3px, rgba(0,0,0,.06) 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: relative; z-index: 1;
      width: 100%;
      max-width: 760px;
      padding: 28px 20px 12px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* robot SVG avatar */
    .avatar-wrap {
      flex-shrink: 0;
      width: 72px; height: 72px;
      position: relative;
    }
    .avatar-ring {
      position: absolute; inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--cyan);
      animation: spin-ring 8s linear infinite;
      border-top-color: transparent;
      border-right-color: transparent;
    }
    @keyframes spin-ring {
      to { transform: rotate(360deg); }
    }
    .avatar-ring2 {
      position: absolute; inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(0,229,255,.2);
      animation: spin-ring 14s linear infinite reverse;
    }
    .robot-face {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--panel);
      border: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      overflow: hidden;
      position: relative;
    }
    .robot-eyes {
      display: flex; gap: 12px;
    }
    .eye {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      animation: blink 4s ease-in-out infinite;
    }
    .eye:nth-child(2) { animation-delay: .1s; }
    @keyframes blink {
      0%,90%,100% { transform: scaleY(1); }
      95% { transform: scaleY(.05); }
    }
    .robot-mouth {
      width: 22px; height: 3px;
      background: var(--cyan);
      border-radius: 2px;
      box-shadow: 0 0 6px var(--cyan);
      transition: width .3s;
    }
    .robot-face.talking .robot-mouth {
      animation: talk .25s ease-in-out infinite alternate;
    }
    @keyframes talk {
      from { height: 3px; }
      to   { height: 7px; }
    }

    .header-text {}
    .header-title {
      font-family: 'VT323', monospace;
      font-size: 2.4rem;
      color: var(--cyan);
      text-shadow: 0 0 14px rgba(0,229,255,.6);
      letter-spacing: 2px;
      line-height: 1;
    }
    .header-sub {
      font-size: .8rem;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: .5px;
    }
    .badge {
      display: inline-block;
      font-size: .68rem;
      background: rgba(0,229,255,.08);
      border: 1px solid rgba(0,229,255,.25);
      color: var(--cyan);
      border-radius: 4px;
      padding: 2px 7px;
      margin-top: 5px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ── divider ── */
    .divider {
      position: relative; z-index: 1;
      width: 100%; max-width: 760px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--cyan), transparent);
      opacity: .3;
      margin: 0 auto 4px;
    }

    /* ── hint bar ── */
    .hint-bar {
      position: relative; z-index: 1;
      width: 100%; max-width: 760px;
      padding: 8px 20px;
      font-size: .78rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hint-bar span { color: var(--amber); }

    /* ── CHAT WINDOW ── */
    #chat-window {
      position: relative; z-index: 1;
      width: 100%; max-width: 760px;
      flex: 1;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      min-height: 320px;
      max-height: calc(100vh - 280px);
    }

    /* message wrapper */
    .msg {
      display: flex;
      gap: 10px;
      animation: fadein .3s ease both;
    }
    @keyframes fadein {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.user { flex-direction: row-reverse; }

    .msg-icon {
      flex-shrink: 0;
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .8rem;
    }
    .msg.meca .msg-icon {
      background: rgba(0,229,255,.1);
      border: 1px solid rgba(0,229,255,.3);
      color: var(--cyan);
    }
    .msg.user .msg-icon {
      background: rgba(0,255,157,.08);
      border: 1px solid rgba(0,255,157,.2);
      color: var(--green);
    }

    .bubble {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: .92rem;
      line-height: 1.6;
    }
    .msg.meca .bubble {
      background: var(--bubble-meca);
      border: 1px solid var(--border);
      border-left: 2px solid var(--cyan);
      color: var(--text);
    }
    .msg.user .bubble {
      background: var(--bubble-user);
      border: 1px solid rgba(0,255,157,.15);
      border-right: 2px solid var(--green);
      color: #a8f0d0;
    }

    /* validated bubble flash */
    .bubble.validated {
      animation: val-flash .6s ease;
    }
    @keyframes val-flash {
      0% { box-shadow: 0 0 0 rgba(0,255,157,0); }
      40% { box-shadow: 0 0 24px rgba(0,255,157,.5); }
      100% { box-shadow: 0 0 0 rgba(0,255,157,0); }
    }

    /* typing indicator */
    .typing-dots {
      display: flex; gap: 5px; align-items: center;
      padding: 14px 16px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      animation: bounce .9s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .18s; }
    .dot:nth-child(3) { animation-delay: .36s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); opacity: .3; }
      30% { transform: translateY(-7px); opacity: 1; }
    }

    /* ── INPUT ZONE ── */
    .input-zone {
      position: relative; z-index: 1;
      width: 100%; max-width: 760px;
      padding: 12px 20px 20px;
    }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      transition: border-color .2s;
    }
    .input-row:focus-within {
      border-color: rgba(0,229,255,.5);
      box-shadow: 0 0 16px rgba(0,229,255,.07);
    }
    #user-input {
      flex: 1;
      background: transparent;
      border: none; outline: none;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: .93rem;
      resize: none;
      min-height: 24px;
      max-height: 120px;
      line-height: 1.5;
    }
    #user-input::placeholder { color: var(--muted); }

    #send-btn {
      flex-shrink: 0;
      background: var(--cyan);
      border: none;
      border-radius: 8px;
      width: 38px; height: 38px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s, box-shadow .15s;
    }
    #send-btn:hover {
      transform: scale(1.07);
      box-shadow: 0 0 12px rgba(0,229,255,.5);
    }
    #send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    #send-btn svg { width: 18px; height: 18px; fill: var(--bg); }

    .input-hint {
      font-size: .72rem;
      color: var(--muted);
      margin-top: 7px;
      padding-left: 4px;
    }

    /* ── CORPUS CHIPS ── */
    .corpus-zone {
      position: relative; z-index: 1;
      width: 100%; max-width: 760px;
      padding: 4px 20px 10px;
    }
    .corpus-label {
      font-size: .72rem;
      color: var(--muted);
      margin-bottom: 7px;
      letter-spacing: .5px;
      text-transform: uppercase;
    }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      background: rgba(255,190,0,.06);
      border: 1px solid rgba(255,190,0,.25);
      color: var(--amber);
      border-radius: 20px;
      padding: 4px 13px;
      font-size: .8rem;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .chip:hover {
      background: rgba(255,190,0,.14);
      transform: translateY(-1px);
    }

    /* ── scrollbar ── */
    #chat-window::-webkit-scrollbar { width: 4px; }
    #chat-window::-webkit-scrollbar-track { background: transparent; }
    #chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>

<header>
  <div class="avatar-wrap">
    <div class="avatar-ring"></div>
    <div class="avatar-ring2"></div>
    <div class="robot-face" id="robot-face">
      <div class="robot-eyes">
        <div class="eye"></div>
        <div class="eye"></div>
      </div>
      <div class="robot-mouth"></div>
    </div>
  </div>
  <div class="header-text">
    <div class="header-title">MÉCA</div>
    <div class="header-sub">L'enquêteur des systèmes — Technologie 4ème</div>
    <div class="badge">⚙ P12 · A2 — Systèmes mécanisés &amp; automatisés</div>
  </div>
</header>

<div class="divider"></div>

<div class="corpus-zone">
  <div class="corpus-label">🔍 Objets du corpus — clique pour analyser</div>
  <div class="chips">
    <div class="chip" onclick="sendCorpus('le lave-linge')">🫧 Lave-linge</div>
    <div class="chip" onclick="sendCorpus('le feu tricolore')">🚦 Feu tricolore</div>
  </div>
</div>

<div id="chat-window"></div>

<div class="input-zone">
  <div class="input-row">
    <textarea id="user-input" rows="1" placeholder="Cite un objet ou un système à analyser…" autocomplete="off"></textarea>
    <button id="send-btn" onclick="sendMessage()" title="Envoyer">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
  <div class="input-hint">↵ Entrée pour envoyer · Shift+Entrée pour sauter une ligne</div>
</div>

<script>
// ── SYSTEM PROMPT ─────────────────────────────────────────────────────────
const SYSTEM_PROMPT = `Tu es MÉCA, un robot-enquêteur bienveillant et curieux qui aide des élèves de 4ème en cours de Technologie (collège, France).

TON OBJECTIF SECRET : Amener l'élève à découvrir par lui-même la différence entre un système manuel, un système mécanisé et un système automatisé. Tu ne révèles jamais la réponse directement.

LES TROIS CATÉGORIES (pour ta compréhension, ne pas citer sauf validation) :
- Manuel : l'humain fournit l'énergie ET prend toutes les décisions (ex : marteau, scie à main, crayon)
- Mécanisé : une énergie extérieure (électricité, moteur) fait le travail physique, MAIS c'est l'humain qui décide quand démarrer, régler et arrêter (ex : perceuse électrique, lave-linge basique, bicyclette électrique)
- Automatisé : le système prend lui-même des décisions selon des capteurs ou un programme — il s'adapte, détecte, agit seul (ex : feu tricolore avec détection, climatiseur avec thermostat, lave-linge avec programme intelligent)

TES RÈGLES D'OR ABSOLUES :
1. N'utilise JAMAIS les mots "manuel", "mécanisé" ou "automatisé" en premier. Attends que l'élève les trouve.
2. Pose UNE SEULE question à la fois. Jamais deux.
3. Ne dis jamais "non, c'est faux". Dis plutôt : "Hmm… intéressant. Mais réfléchis à ça : …" ou "Tu chauffes ! Et si je te demandais…"
4. Quand l'élève trouve la bonne réponse ou utilise le bon mot-clé, VALIDE avec enthousiasme et explique clairement pourquoi c'est juste. Utilise "✅ TROUVÉ !" ou "🎯 EXACTEMENT !".
5. Ne donne pas d'indices trop directs : guide par les questions, pas par les réponses.

TES QUESTIONS GUIDES (à utiliser intelligemment selon la situation) :
- "Qui ou quoi fournit l'énergie pour faire fonctionner cet objet ?"
- "Qui fait le geste ou le mouvement ?"
- "Qui décide QUAND ça démarre et QUAND ça s'arrête ?"
- "Est-ce que l'objet peut réagir tout seul si quelque chose change autour de lui ?"
- "Imagine que tu t'endormes à côté : est-ce que l'objet saurait s'arrêter au bon moment ?"
- "Qu'est-ce qui changerait si on enlevait l'humain du système ?"

OBJETS DU CORPUS (tu les connais parfaitement) :
- Le lave-linge BASIQUE (années 80) : électrique donc pas manuel, mais c'est toi qui choisis le programme, qui mets le linge, qui appuies → mécanisé. Un lave-linge MODERNE qui pèse le linge, adapte la quantité d'eau et détecte la fin du cycle → automatisé.
- Le feu tricolore SIMPLE (minuterie fixe) : il change selon une horloge → mécanisé. Le feu tricolore INTELLIGENT avec capteurs de voitures → automatisé.

TON STYLE :
- Langue simple, phrases courtes, niveau collège
- Curieux, bienveillant, jamais condescendant
- Tu peux utiliser des emojis avec parcimonie ⚙ 🔍 💡 ✅
- Tu peux faire des analogies amusantes pour débloquer un élève
- Quand un élève arrive à la bonne conclusion : célèbre vraiment, explique pourquoi c'est juste

POUR COMMENCER : Quand l'élève te cite un objet, commence toujours par accuser réception avec enthousiasme, puis pose ta première question d'enquête. N'explique jamais rien avant que l'élève ait réfléchi.`;

// ── CONFIG GEMINI ────────────────────────────────────────────────────────
const GEMINI_KEY = 'AIzaSyDTdRAg8hLvMFhQNZLLbC8ajyZBClnpOrY';
const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`;

// ── STATE ────────────────────────────────────────────────────────────────
const history = [];
const chatWindow = document.getElementById('chat-window');
const input     = document.getElementById('user-input');
const sendBtn   = document.getElementById('send-btn');
const robotFace = document.getElementById('robot-face');

// ── WELCOME MESSAGE ──────────────────────────────────────────────────────
function initWelcome() {
  const welcome = `Bonjour ! Je suis <strong>MÉCA</strong>, ton assistant-enquêteur 🔍<br><br>
Ma mission du jour : t'aider à percer les secrets des systèmes qui nous entourent.<br><br>
Voici comment on va travailler : <strong>tu me donnes un objet ou un système</strong> (une machine, un appareil, un outil…), et on l'examine ensemble grâce à des questions.<br><br>
Alors… quel objet veux-tu qu'on analyse ? Ou clique sur un objet du corpus ci-dessus pour commencer directement !`;
  appendMessage('meca', welcome);
}

// ── CORPUS SHORTCUT ──────────────────────────────────────────────────────
function sendCorpus(obj) {
  input.value = obj;
  sendMessage();
}

// ── SEND ─────────────────────────────────────────────────────────────────
async function sendMessage() {
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;

  input.value = '';
  input.style.height = 'auto';
  appendMessage('user', escapeHtml(text));
  history.push({ role: 'user', content: text });

  sendBtn.disabled = true;
  robotFace.classList.add('talking');
  const typingEl = showTyping();

  try {
    // Convertit l'historique au format Gemini
    const geminiContents = history.map(m => ({
      role: m.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: m.content }]
    }));

    const response = await fetch(GEMINI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: geminiContents,
        generationConfig: { maxOutputTokens: 500 }
      })
    });

    const data = await response.json();
    const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "⚠️ Erreur de connexion avec MÉCA.";

    typingEl.remove();
    robotFace.classList.remove('talking');

    const isValidation = /✅|🎯|TROUVÉ|EXACTEMENT|bravo|félicit/i.test(reply);
    appendMessage('meca', formatReply(reply), isValidation);
    history.push({ role: 'assistant', content: reply });
  } catch (err) {
    typingEl.remove();
    robotFace.classList.remove('talking');
    appendMessage('meca', '⚠️ Connexion perdue. Vérifie ta connexion et réessaie.');
  }

  sendBtn.disabled = false;
  input.focus();
}

// ── DOM HELPERS ──────────────────────────────────────────────────────────
function appendMessage(who, html, validated = false) {
  const msg = document.createElement('div');
  msg.className = `msg ${who}`;

  const icon = document.createElement('div');
  icon.className = 'msg-icon';
  icon.textContent = who === 'meca' ? '⚙' : '👤';

  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (validated ? ' validated' : '');
  bubble.innerHTML = html;

  msg.appendChild(icon);
  msg.appendChild(bubble);
  chatWindow.appendChild(msg);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  return msg;
}

function showTyping() {
  const msg = document.createElement('div');
  msg.className = 'msg meca';

  const icon = document.createElement('div');
  icon.className = 'msg-icon';
  icon.textContent = '⚙';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';

  msg.appendChild(icon);
  msg.appendChild(bubble);
  chatWindow.appendChild(msg);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  return msg;
}

function formatReply(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── TEXTAREA AUTO-RESIZE + ENTER ─────────────────────────────────────────
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ── INIT ─────────────────────────────────────────────────────────────────
initWelcome();
</script>
</body>
</html>
